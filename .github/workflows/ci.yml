name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wellofwisdom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build
      - run: npm run check
      - run: npm test
        env:
          DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wellofwisdom_test
