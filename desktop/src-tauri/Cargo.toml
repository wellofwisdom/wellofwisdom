[package]
name = "wellofwisdom-desktop"
version = "0.0.1"
description = "Well of Wisdom desktop"
authors = ["Well of Wisdom"]
edition = "2021"
repository = "https://github.com/wellofwisdom/wellofwisdom"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
