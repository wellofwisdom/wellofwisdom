<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Well of Wisdom</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center}
  .box{text-align:center}
  .spinner{width:32px;height:32px;border:3px solid #334155;border-top-color:#e2e8f0;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" aria-hidden="true"></div>
  <p>Starting Well of Wisdom...</p>
  <p style="font-size:12px;opacity:0.6">The local server is starting. This takes a few seconds the first time.</p>
</div>
</body>
</html>
